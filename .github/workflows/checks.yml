name: PRSL source and research integrity
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: lab/requirements-lab.txt
      - name: Install Lab-only catalog verification dependency
        run: python -m pip install -r lab/requirements-lab.txt
      - name: Verify original Lab member checksums and provenance
        run: python tools/verify_lab_provenance.py
      - name: Validate research and handoff status
        run: python tools/validate_handoff.py
      - name: Repository + importer regression tests
        run: python -m unittest discover -s tests -v
      - name: Original offline Lab regression tests (engine-only tests skip)
        working-directory: lab
        env:
          MOO2_ENGINE: ''
        run: python -m unittest discover -s tests -v
      - name: Explain validation scope
        run: |
          echo 'The original Lab is NOT a playable PRSL game mod.'
          echo 'No commercial engine/game files, native compatibility probe, DOSBox or two-client acceptance in CI.'
          echo 'The 9 optional exact-engine structural tests should skip when MOO2_ENGINE is absent.'
