name: Repository integrity
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  handoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check handoff and research records
        run: python tools/validate_handoff.py
      - name: Test source-import security
        run: python -m unittest discover -s tests -v
      - name: Advise on missing original lab
        if: always()
        run: |
          if [ ! -f lab/prsl/state.py ]; then
            echo 'Original v0.2.0 source has not been imported. Only handoff tooling was tested.'
          else
            echo 'Original v0.2.0 source present. Run its own suite in a separate, opt-in integration workflow.'
          fi
